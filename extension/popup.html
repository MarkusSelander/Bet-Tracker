<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <title>Coolbet → Bet Tracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Coolbet-synk</h1>
      <p id="status" class="status">Sjekker…</p>
    </header>
    <p id="last-sync" class="muted"></p>
    <div
      id="progress"
      class="progress"
      hidden
      role="progressbar"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-label="Synk-fremgang"
    >
      <div class="progress-track">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <p id="progress-label" class="muted"></p>
    </div>
    <p id="result" class="muted"></p>
    <p id="error" class="error" hidden></p>
    <div class="actions">
      <button id="sync-now" type="button">Synk nå</button>
      <button id="open-options" type="button" class="secondary">Innstillinger</button>
    </div>
    <script src="lib/history.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
