<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <title>Bet Tracker-synk</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Bet Tracker-innlogging</h1>
      <p class="lead">
        Utvidelsen henter spillhistorikk fra Coolbet (der du er innlogget i Chrome) og sender
        kupongene til Bet Tracker. Logg inn med samme Google-konto som på nettsiden, eller lim inn
        token derfra. Coolbet-passord lagres ikke.
      </p>

      <label for="api-url">Backend-URL</label>
      <input id="api-url" type="url" placeholder="https://ditt-api-domene.example" />

      <fieldset>
        <legend>Logg inn med Google</legend>
        <label for="google-client-id">Google OAuth-klient-ID</label>
        <input id="google-client-id" type="text" autocomplete="off" placeholder="….apps.googleusercontent.com" />
        <label for="firebase-api-key">Firebase API-nøkkel</label>
        <input id="firebase-api-key" type="text" autocomplete="off" />
        <label for="firebase-auth-domain">Firebase auth-domene</label>
        <input id="firebase-auth-domain" type="text" autocomplete="off" placeholder="prosjekt.firebaseapp.com" />
        <button id="login" type="button">Logg inn med Google</button>
      </fieldset>

      <label for="token">Eller lim inn session-token</label>
      <input id="token" type="password" placeholder="session_…" />

      <label class="check">
        <input id="auto-login" type="checkbox" />
        Auto-synk når du logger inn på Coolbet
      </label>
      <label class="check">
        <input id="auto-history" type="checkbox" />
        Auto-synk når du åpner Coolbet bet-history
      </label>
      <label class="check">
        <input id="auto-alarm" type="checkbox" />
        Auto-synk hver 6. time (åpner Coolbet i bakgrunnen)
      </label>

      <button id="save" type="button">Lagre</button>
      <p id="message" class="message" hidden></p>
    </main>
    <script src="auth-config.js"></script>
    <script src="lib/googleAuth.js"></script>
    <script src="lib/history.js"></script>
    <script src="options.js"></script>
  </body>
</html>
